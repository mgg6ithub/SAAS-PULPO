# Compila la app Flutter (app/) para web y la publica en GitHub Pages en cada push a main.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release --base-href /SAAS-PULPO/
      - name: Versionar recursos del build
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          build = Path('build/web')
          version = os.environ['BUILD_SHA']
          bootstrap = build / 'flutter_bootstrap.js'
          source = bootstrap.read_text()
          marker = '"mainJsPath":"main.dart.js"'
          if marker not in source:
              raise SystemExit('No se encontró mainJsPath en flutter_bootstrap.js')
          bootstrap.write_text(source.replace(marker, f'"mainJsPath":"main.dart.js?v={version}"', 1))
          (build / 'version.txt').write_text(version + '\n')
          PY
      - run: cp -R ../landing build/web/landing
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
