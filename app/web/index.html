<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Organiza las tareas y rutas de tu empresa de mantenimiento.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pulpo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pulpo</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    (async () => {
      const bootstrap = document.createElement('script');
      bootstrap.async = true;

      try {
        const versionUrl = new URL('version.txt', document.baseURI);
        versionUrl.searchParams.set('t', Date.now().toString());
        const response = await fetch(versionUrl, { cache: 'no-store' });
        const version = (await response.text()).trim();

        if (!response.ok || !/^[0-9a-f]{40}$/.test(version)) {
          throw new Error('Build version unavailable');
        }

        const pageUrl = new URL(window.location.href);
        if (pageUrl.searchParams.get('pulpo-version') !== version) {
          pageUrl.searchParams.set('pulpo-version', version);
          window.location.replace(pageUrl);
          return;
        }

        bootstrap.src = `flutter_bootstrap.js?v=${version}`;
      } catch (_) {
        bootstrap.src = 'flutter_bootstrap.js';
      }

      document.body.append(bootstrap);
    })();
  </script>
</body>
</html>
